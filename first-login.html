<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password — Velorian Bank</title><link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/preloader.css">
</head><body class="login-page client-login-page">
  <div id="vb-preloader" aria-label="Loading Velorian Bank" role="status">
    <div class="vb-loader-shell">
      <div class="vb-loader-mark">
        <span class="vb-loader-ring"></span>
        <img class="vb-loader-logo" src="../assets/logo-transparent.png" alt="Velorian Bank">
      </div>
      <p class="vb-loader-name">Velorian Bank</p>
      <p class="vb-loader-status">Securing your banking experience</p>
      <div class="vb-loader-progress" aria-hidden="true"></div>
    </div>
  </div>
<div class="login-bg" style="background-image:linear-gradient(90deg,rgba(2,9,16,.90),rgba(3,13,23,.62)),url('../assets/backgrounds/client-login-bg.jpg')"></div><main class="login-shell"><section class="login-card glass"><img src="../assets/logo-transparent.png" class="login-logo" alt="Velorian Bank"><span class="eyebrow">FIRST-TIME SECURITY SETUP</span><h1>Create your new password</h1><p class="login-sub">For your security, the temporary password assigned by Velorian Bank must be replaced before you can access your account.</p><form id="firstPasswordForm" class="form-stack"><label>Temporary password<input id="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><small>Use at least 8 characters.</small></label><label>Confirm new password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><div id="firstPasswordError" class="login-error"></div><button class="primary-btn" type="submit">Create password →</button></form><button id="logoutFirst" class="text-btn" type="button">Sign out</button></section></main><script src="../js/storage.js"></script><script src="../js/access-control.js"></script><script src="../js/first-login.js"></script>
  <script src="../js/preloader.js"></script>
<script src="../js/password-toggle.js"></script>
</body></html>
